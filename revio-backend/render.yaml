services:
  - type: web
    name: revio-backend
    runtime: python
    buildCommand: "pip install -r requirements.txt && python manage.py migrate && (python manage.py createsuperuser --noinput || true)"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.14"
      - key: DEBUG
        value: "False"
      - key: PORT
        value: "10000"
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
